# afsim-forge-skill 配置 —— 单点维护
# 本文件只放**其它文档不重复**的配置锚点；叙述性规则的权威在 workflows/ 与 blueprints/。
#
# 写入边界：skill 目录（含本文件）运行期**只读**；运行期产出一律写工作空间的 .afsim-forge/。
# 输入解析规则见 workflows/1_intake.md；本地可执行文件备用通道见 workflows/local-exec.md。

# ── MCP 工具（校验首选；仿真/回放仅交付后按需）──────────────────
mcp:
  # 工具名前缀由宿主环境 serverName 决定（mcp__<server_name>__）；serverName 变了只需改这一处。
  prefix: "mcp__afsim__"

  # 全部工具已解禁，但**按阶段取用**（详见 workflows/4_validate.md §7 与 5_deliver.md §4）：
  #   校验阶段：health / selftest（可选）、validate_scenario（核心）
  #   交付后仿真 / 回放：仅在用户明确要求时使用
  allow:
    - selftest            # MCP 链路自检
    - health              # 校验服务健康检查
    - validate_scenario   # ★ 语法校验（核心）
    - upload_zip          # 仅交付后仿真
    - submit_simulation   # 仅交付后仿真
    - get_simulation      # 仅交付后仿真（轮询状态）
    - list_results        # 仅交付后仿真（取结果清单）
    - download_result     # 仅交付后仿真（下载 output 到工程 output/）
    - replay              # 仅交付后回放

  # 校验调用与判据（完整调用示例、返回契约、错误定位见 workflows/4_validate.md）
  validate:
    tool: "mcp__afsim__validate_scenario"
    judge: "data.valid"        # 唯一判据；语法对错都返回 HTTP 200
    max_repair_rounds: 3       # 修复循环上限

  # 备用通道：MCP 不可用时直调本地可执行文件（命令、判据、错误解析见 workflows/local-exec.md）
  fallback:
    enabled: "ask_user_on_mcp_unavailable"   # 每次询问用户本地安装路径，不固化

# ── 输入约定 ────────────────────────────────────────────────
# 规则唯一权威在 workflows/1_intake.md（两类输入 / 优先级 / JSON 三铁律 / 6 项产物），本文件不复述。

# ── 工程结构约定 ────────────────────────────────────────────
project:
  structure_ref: "blueprints/layout/layout.md"    # ★ 结构唯一权威（目录树、9 根文件、块→目录映射）
  assembly_ref: "blueprints/layout/assembly.md"   # 装配规则（include 顺序、include vs include_once）
  defaults_ref: "blueprints/layout/defaults.md"   # 缺省值清单
  spec_source: "docs/体系工程文件说明-20260922/样例工程规范.md"   # skill 外溯源，非运行依赖
  verified_cases: "blueprints/cases"              # 5 个实测 valid=true 的完整案例

# ── 运行时状态（★ 写入工作空间，绝不写入 skill 目录）────────────
runtime:
  # 相对当前工作空间（cwd），非 skill 安装目录——skill 可能被多项目共享，写 skill 目录会串味。
  state_dir: ".afsim-forge"

  # 成果闭环（位于工作空间）
  output:
    staging: ".afsim-forge/output/staging"            # 已生成、待校验
    verified: ".afsim-forge/output/verified"          # 已过校验 + 用户认可，只进不出
    verified_subdirs: [scenario, component, template]

  # 本项目运行时教训；skill 的 knowledge/lessons/ 是只读基线，二者同构，先查本项目再看基线
  lessons: ".afsim-forge/lessons"

  write_policy:
    skill_dir: "read-only"      # skill 目录运行期只读
    state_dir: "read-write"     # 运行时状态一律写这里
