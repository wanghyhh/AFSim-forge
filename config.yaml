# afsim-forge 配置 —— 单点维护
# 修改本文件即可调整 MCP 契约与工程结构约定，无需改动 workflows/ 与 SKILL.md。
#
# 边界说明：本 skill 只通过 MCP 工具完成校验，**不接触 AFSIM 本体**。
# AFSIM 的安装位置、可执行文件、命令行参数等均属 MCP 服务端职责，本文件不体现。

# ── MCP 校验工具（唯一校验通道）────────────────────────────────
mcp:
  # 工具名前缀由 DSH 中 mcp-client 的 serverName 决定：mcp__<server_name>__
  # 若 DSH 侧改了 serverName，只需同步此处与下方 tool 字段。
  prefix: "mcp__afsim__"

  # 白名单：本 skill 允许调用的工具
  allow:
    - selftest            # MCP 链路自检
    - health              # 校验服务健康检查
    - validate_scenario   # ★ 语法校验（核心）

  # 负向防御：以下工具属服务端其他能力，本 skill 一律不用
  deny:
    - upload_zip
    - submit_simulation
    - get_simulation
    - list_results
    - download_result
    - replay

  # 校验调用规范
  validate:
    tool: "mcp__afsim__validate_scenario"
    params:
      zip_path: "<ZIP 绝对路径，需为 MCP 服务所在机器可读>"
      full_output: false      # true 时返回完整校验输出（默认截断）
    # 判据：只看 data.valid；语法对错都返回 HTTP 200
    judge: "data.valid"
    # 失败定位字段
    error_fields: [severity, message, file, line, column]
    # 修复循环上限
    max_repair_rounds: 3
    # 升级取全文的阈值：output 不足以定位时改用 full_output=true
    escalate_on_insufficient_output: true

  # 返回契约：{ok, code, msg, data}，任何情况都不抛异常
  response:
    ok_field: ok
    code_field: code
    msg_field: msg
    data_field: data
    # 链路错误码 —— 与语法对错无关，仅用于兜底话术
    codes:
      0: "校验服务不可达 —— 请用户确认校验服务已启动"
      400: "参数或 ZIP 不合规（多为缺同名启动文件）"
      404: "zip_path 指向的文件不存在"
    # 未列出的 code：读 msg 原文向用户报告，不得据此判断语法对错
    fallback: "读 msg 原文，向用户报告；不要用 code 判断语法对错"

# ── 工程结构约定 ──────────────────────────────────────────────
project:
  # 结构权威说明（运行依赖）—— 与本文件冲突时以它为准
  structure_ref: "blueprints/layout/layout.md"
  # 装配规则（include 顺序、include vs include_once、命名约定）
  assembly_ref: "blueprints/layout/assembly.md"
  # 缺省值清单
  defaults_ref: "blueprints/layout/defaults.md"
  # 溯源：本规范的来源文档（**skill 外路径，仅记录出处，非运行依赖**；随 skill 分发时该文件不存在属正常）
  spec_source: "docs/体系工程文件说明-20260922/样例工程规范.md"
  # 更可靠的实测正例（5 个工程，全部 valid=true）
  verified_cases: "blueprints/cases"

  # 入口文件规则
  entry_file: "<想定名>.txt"          # 严格同名，且与 ZIP 同名
  entry_path_variable: "define_path_variable CASE <想定名>"
  # 路径基准：必须存在，且在第一个 include_once 之前（AFSIM 按它搜索 include 目标）
  entry_file_path: "file_path ."

  # 规范定义的全量目录（14 个）
  # 注意：**并非全部必建** —— 只建实际用到的；但 config/ output/ side/ 与 4 个必建根文件必须有。
  #      入口文件里不得 include_once 不存在的文件。
  all_dirs:
    - config
    - common
    - output
    - medium
    - comm
    - mover
    - network
    - platform
    - processor
    - sensor
    - side
    - signatures
    - weapon
    - weapon_effects

  # 根文件（9 个）
  root_files:
    required: ["<想定名>.txt", setup.txt, event_pipe.txt, global_env.txt]
    optional: [global_route.txt, global_script.txt, global_struct.txt, group.txt, zone.txt]

  # output/ 占位文件（ZIP 不保留空目录，必须占位）
  output_placeholder: "output/blank_empty.txt"

  # 命名约束
  naming:
    scenario_name: "字母/数字/下划线，无中文、无空格"
    instance_name: "<类型名>_<业务code>"

  # 禁止项
  forbidden:
    - "中文路径"
    - "扩展名 .wsf"
    - "数值不带单位"

# ── 运行时状态（★ 写入工作空间，绝不写入 skill 目录）────────────
# 原则：skill 目录是**只读资产**（本文件、SKILL.md、workflows/、blueprints/、knowledge/），
#      运行期一律不写；一切运行时产出写入**当前工作空间**下的状态目录。
runtime:
  # 状态根目录 —— 相对**当前工作空间**（cwd），而非 skill 安装目录。
  # 理由：skill 可能被多个项目共享，写 skill 目录会串味、且 skill 升级会丢失积累。
  state_dir: ".afsim-forge"

  # 运行时产出区（成果闭环）—— 位于工作空间，不在 skill 目录内
  output:
    staging: ".afsim-forge/output/staging"              # 已生成、待校验
    verified: ".afsim-forge/output/verified"            # 已过校验 + 用户认可，只进不出
    verified_subdirs: [scenario, component, template]

  # 本项目运行时积累的教训（新报错 → 新增条目）
  # 注意：skill 的 knowledge/lessons/*.md 是**只读基线**，二者同构；
  #      查教训时先看本项目 lessons/，再看 skill 基线。
  lessons: ".afsim-forge/lessons"

  # 写入边界
  write_policy:
    skill_dir: "read-only"        # skill 目录运行期只读
    state_dir: "read-write"       # 运行时状态一律写这里
